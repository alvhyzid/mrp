name: Backup Database (terjadwal + manual)

# GELOMBANG 1 poin 8 / instruksi A2 (18 Agu 2026) — syarat WAJIB "pg_dump backup dulu"
# sebelum pembersihan data demo lama tidak bisa dipenuhi dari environment kerja lokal
# (tidak ada Docker sama sekali di sana, dan `supabase db dump` SELALU shell-out ke
# pg_dump lewat container terlepas dari target lokal/remote — lihat HANDOFF.md). GitHub
# Actions runner PUNYA Docker (dibuktikan job "Rebuild Schema from Migrations" di
# ci.yml, jalan tiap push), jadi backup SUNGGUHAN (schema + DATA) dijalankan di sini.
#
# KOREKSI (run #1-#2 gagal, run #2 dibuktikan lewat log sungguhan): `supabase db dump`
# TIDAK PUNYA mode gabungan schema+data dalam 1 command — `--help` cuma punya toggle
# `--data-only` (data SAJA); tanpa flag itu, hasilnya SCHEMA SAJA (dibuktikan: dump
# tanpa --data-only cuma berisi CREATE TABLE/ALTER TABLE/CREATE SEQUENCE utk companies,
# NOL baris COPY/INSERT data). Jadi backup PENUH butuh 2 pemanggilan terpisah, digabung
# jadi 1 file (schema dulu, baru data — urutan pg_dump standar).
#
# INF-05 (22 Agu 2026, SUPER URGENT) — audit infrastruktur INF-01 menemukan backup
# project berisi data nyata PT ITM TIDAK PERNAH otomatis (fitur PITR asli Supabase mati,
# 0 snapshot; jalur ini sebelumnya HANYA workflow_dispatch manual, retensi artifact 7
# hari, backup terakhir yang berhasil sempat 2 hari sebelum ditemukan). Ditambah
# `schedule` (cron harian) supaya berjalan OTOMATIS tanpa menunggu diklik, dan retensi
# artifact dinaikkan dari 7 ke 30 hari. Pemeriksaan isi (bukan cuma status hijau) SUDAH
# ADA sejak awal di step "Verifikasi dump tidak kosong & berisi data" di bawah -- tidak
# diubah, sudah memenuhi syarat "backup yang tidak diperiksa isinya sama dengan tidak
# ada backup".
on:
  workflow_dispatch: {}
  schedule:
    # 18:00 UTC = 01:00 WIB -- jam sepi trafik, jauh dari jam kerja.
    - cron: '0 18 * * *'

jobs:
  backup:
    name: pg_dump penuh (schema + data) dari project remote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: supabase link
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: supabase db dump --linked (schema)
        run: supabase db dump --linked -f backup-schema.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: supabase db dump --linked --data-only (data)
        run: supabase db dump --linked --data-only -f backup-data.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Gabungkan jadi 1 file backup penuh (schema dulu, baru data)
        run: |
          STAMP=$(date +%Y%m%d-%H%M%S)
          cat backup-schema.sql backup-data.sql > "backup-full-${STAMP}.sql"

      - name: Verifikasi dump tidak kosong & berisi data (bukan cuma schema kosong)
        run: |
          FILE=$(ls backup-full-*.sql)
          SIZE=$(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE")
          echo "Ukuran dump gabungan: ${SIZE} bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "GAGAL: dump terlalu kecil (<10KB) — kemungkinan schema/data kosong." >&2
            exit 1
          fi
          COPY_COUNT=$(grep -cE "^COPY " "$FILE" || true)
          INSERT_COUNT=$(grep -cE "^INSERT INTO " "$FILE" || true)
          echo "Jumlah baris COPY: ${COPY_COUNT}, baris INSERT INTO: ${INSERT_COUNT}"
          if [ "$COPY_COUNT" -eq 0 ] && [ "$INSERT_COUNT" -eq 0 ]; then
            echo "GAGAL: tidak ada satu baris COPY/INSERT pun — dump TIDAK berisi data sama sekali." >&2
            exit 1
          fi
          # PENTING (pelajaran dari ci.yml job rebuild-migrations): nama tabel di dump
          # SELALU dikutip "public"."companies" (--quote-all-identifier), bukan polos.
          if ! grep -qE "COPY \"?public\"?\.\"?companies\"?[[:space:]\(]" "$FILE" && ! grep -qE "INSERT INTO \"?public\"?\.\"?companies\"?[[:space:]\(]" "$FILE"; then
            echo "GAGAL: dump tidak berisi data spesifik tabel companies." >&2
            exit 1
          fi
          # KOREKSI (18 Agu 2026): pengecekan manual pemeriksa manusia sebelumnya salah
          # menyimpulkan dump "schema-only" karena hanya mencari string "COPY public."
          # -- padahal `supabase db dump` TANPA flag --use-copy menulis data pakai format
          # "INSERT INTO ... VALUES (...), (...);" (satu statement per tabel, banyak baris
          # sekaligus), bukan COPY. Kedua format itu sama sah sebagai output pg_dump. Baris
          # di bawah ini mencetak format mana yang sebenarnya dipakai + berapa tabel yang
          # punya data, supaya pemeriksaan manual berikutnya tidak salah baca lagi.
          if [ "$COPY_COUNT" -gt 0 ]; then
            echo "Format data: COPY (${COPY_COUNT} block)."
          else
            echo "Format data: INSERT INTO (bukan COPY -- ini NORMAL kalau --use-copy tidak dipakai)."
          fi
          TABLES_WITH_DATA=$(grep -oE '^(COPY|INSERT INTO) "[a-z_]+"\."[a-zA-Z_]+"' "$FILE" | sort -u | wc -l | tr -d ' ')
          echo "Jumlah tabel (semua schema) yang punya data di dump ini: ${TABLES_WITH_DATA}."
          echo "OK: dump gabungan berisi schema DAN data sungguhan (${COPY_COUNT} COPY block, ${INSERT_COUNT} INSERT statement, ${TABLES_WITH_DATA} tabel berisi data)."

      - name: Upload backup sebagai artifact (retensi 30 hari -- dinaikkan dari 7, INF-05 22 Agu 2026)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-full
          path: backup-full-*.sql
          retention-days: 30
