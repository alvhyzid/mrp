name: CI

# Sesi 2C (docs/rencana-kerja-playbook-ams.md) — lapisan verifikasi paling dasar,
# otomatis di setiap push: typecheck, seluruh test suite (termasuk RLS lintas-company),
# dan bukti bahwa supabase/migrations/ sendirian cukup untuk membangun ulang skema dari
# nol memakai pg_dump SUNGGUHAN (bukan lagi query information_schema seperti Sesi 2A —
# runner GitHub Actions punya Docker, jadi `supabase db start` bisa jalan).
on:
  push:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # BUILD PRODUKSI (ditambahkan 26 Agu 2026) — dan alasannya sebuah kejadian nyata.
      #
      # CI ini SELAMA INI TIDAK PERNAH MEM-BUILD. Typecheck lulus, seluruh test hijau, dan
      # `next dev` berjalan mulus — sementara `next build` GAGAL dengan 90 galat sekaligus.
      # Penyebabnya satu baris `import '@carbon/react/index.scss'` yang memancarkan aturan
      # @font-face berawalan `~@ibm/plex/...`, sintaks milik webpack yang Turbopack tidak
      # kenal. `next dev` melewatinya karena ia tidak menyelesaikan seluruh aset di muka.
      #
      # Akibatnya: deployment Vercel gagal DUA KALI berturut-turut sementara CI tidak punya
      # satu pun langkah yang bisa berbunyi. Situs tayang berhenti diperbarui, dan satu-satunya
      # petunjuk ada di catatan deployment GitHub — tempat yang tidak dilihat siapa pun.
      #
      # Diletakkan SEBELUM test: build gagal dalam hitungan detik, sedangkan suite test
      # butuh belasan menit. Kegagalan yang murah didahulukan.
      - name: Build produksi (next build) -- typecheck & test TIDAK bisa menangkap kegagalan build
        run: npm run build

      - name: Test suite (typecheck + 25 test lintas-role, termasuk isolasi antar company)
        run: npm run test:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEBUG_ROLE_TEST_PASSWORD: ${{ secrets.DEBUG_ROLE_TEST_PASSWORD }}
          DEBUG_SUPER_ADMIN_PASSWORD: ${{ secrets.DEBUG_SUPER_ADMIN_PASSWORD }}
          DEBUG_COMPANY_A_PASSWORD: ${{ secrets.DEBUG_COMPANY_A_PASSWORD }}

      # `if: always()` DISENGAJA. Tanpa itu, langkah ini dilewati begitu step test gagal —
      # padahal justru saat gagal kita paling butuh angkanya: "berapa test yang BENAR-BENAR
      # berjalan?" membedakan kegagalan nyata (ratusan berjalan, sebagian gagal) dari
      # kegagalan konfigurasi (hampir semuanya dilewati karena fixture tak terbentuk).
      - name: Pengawas ambang jumlah test (SS.1) -- CI hijau tidak cukup, test harus BENAR-BENAR berjalan
        if: always()
        run: npm run check:threshold

  rebuild-migrations:
    name: Rebuild Schema from Migrations (real pg_dump)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `db start` membangun stack Postgres lokal dari image resmi Supabase (bukan
      # Postgres polos — sudah ada schema auth/storage bawaan) LALU menerapkan SELURUH
      # file di supabase/migrations/ secara berurutan, persis proses yang dibuktikan
      # manual di Sesi 2A. Kalau ADA migrasi yang gagal apply (urutan dependency salah,
      # objek dobel, dst), langkah ini gagal dan job berhenti merah di sini.
      - name: supabase db start (apply seluruh migrations/ dari nol)
        run: supabase db start

      # Bukti REAL pg_dump (bukan substitusi introspection pg_catalog dari Sesi 2A) atas
      # database yang baru saja dibangun ulang dari nol lewat migrations/ saja.
      - name: supabase db dump --local (bukti pg_dump asli)
        run: supabase db dump --local -f schema-dump.sql

      # Sanity check tambahan: pastikan dump bukan cuma "berhasil jalan tanpa error" tapi
      # BENAR-BENAR berisi tabel inti hasil migrations/ (bukan skema kosong/gagal senyap).
      #
      # Pola HARUS mengizinkan "IF NOT EXISTS " opsional setelah "CREATE TABLE " — dibuktikan
      # lewat `supabase db dump --local --dry-run` bahwa CLI ini SELALU menyisipkan sed
      # substitution `s/^CREATE TABLE "/CREATE TABLE IF NOT EXISTS "/` (juga
      # --quote-all-identifier, jadi selalu "public"."nama_tabel", bukan opsional). Pola versi
      # pertama (tanpa toleransi ini) gagal cocok untuk SEMUA tabel di run pertama CI —
      # ditemukan lewat `supabase db dump --local --dry-run` lokal, bukan tebakan.
      - name: Verifikasi dump berisi tabel inti
        run: |
          for table in companies users subscription_plans items boms work_orders lots employees status_transition_log; do
            if ! grep -qE "CREATE TABLE (IF NOT EXISTS )?\"?public\"?\.\"?${table}\"?[[:space:]\(]" schema-dump.sql; then
              echo "GAGAL: tabel '${table}' tidak ditemukan di schema-dump.sql hasil rebuild." >&2
              exit 1
            fi
          done
          echo "OK: seluruh tabel inti yang dicek ditemukan di schema hasil rebuild."

      # if: always() supaya dump tetap terunduh untuk debug MESKI langkah verifikasi di atas
      # gagal (di run pertama, artifact ini ikut ter-skip karena step sebelumnya merah,
      # sehingga debugging harus lewat unduh log runner yang jauh lebih lambat).
      - name: Upload schema dump sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-dump
          path: schema-dump.sql
          retention-days: 14

      - name: supabase stop
        if: always()
        run: supabase stop
